services:
  moontracer-api:
    build:
      context: .
      secrets:
        - discord_public_key
        - discord_bot_token
    image: moontracer-api:latest
    container_name: moontracer-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    secrets:
      - discord_public_key
      - discord_bot_token
      - database_url
      - api_secret_key
    environment:
      - NODE_ENV=production
    volumes:
      - ./logs:/app/logs
    networks:
      - caddy_proxy
      - moontracer_internal
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/v1/test"]
      interval: 30s

  postgres:
    image: postgres:16-alpine
    container_name: moontracer-db
    restart: unless-stopped
    secrets:
      - postgres_password
    environment:
      POSTGRES_DB: moontracer
      POSTGRES_USER: moontracer
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - moontracer_internal

secrets:
  discord_public_key:
    file: ./secrets/discord_public_key.txt
  discord_bot_token:
    file: ./secrets/discord_bot_token.txt
  database_url:
    file: ./secrets/database_url.txt
  api_secret_key:
    file: ./secrets/api_secret_key.txt
  postgres_password:
    file: ./secrets/postgres_password.txt

networks:
  moontracer_internal:
    driver: bridge

  caddy_proxy:
    external: true
    name: caddy_proxy

volumes:
  db_data: