services:
  moontracer:
    build: .
    image: moontracer:latest
    container_name: moontracer
    restart: unless-stopped
      #secrets:
        #- discord_bot_token
        #- discord_guild_id
    environment:
      API_SECRET_KEY: ${API_SECRET_KEY}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY}
      VERBOSE: ${VERBOSE}
      SAFE_MODE: ${SAFE_MODE}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DEBUG_ADMIN_ID: ${DEBUG_ADMIN_ID}
      ADMIN_ROLE_NAME: ${ADMIN_ROLE_NAME}
      MOD_ROLE_NAME: ${MOD_ROLE_NAME}
    volumes:
      - /mnt/shared/suncaster/moontracer:/app/data
    networks:
      - caddy_proxy

networks:
  caddy_proxy:
    external: true

      #secrets:
      #discord_bot_token:
      #file: /mnt/shared/suncaster/moontracer/secrets/discord_bot_token.txt
      #  discord_guild_id:
      #file: /mnt/shared/suncaster/moontracer/secrets/discord_guild_id.txt

