services:
  moontracer:
    build: .
    image: moontracer:latest
    container_name: moontracer
    restart: unless-stopped
    secrets:
      - discord_bot_token
      - discord_guild_id
    volumes:
      - /mnt/shared/suncaster/moontracer:/app/data
    networks:
      - caddy_proxy

networks:
  caddy_proxy:
    external: true

secrets:
  discord_bot_token:
    file: /mnt/shared/suncaster/moontracer/secrets/discord_bot_token.txt
  discord_guild_id:
    file: /mnt/shared/suncaster/moontracer/secrets/discord_guild_id.txt

