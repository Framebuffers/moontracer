services:
  moontracer:
    build: .
    image: moontracer:latest
    container_name: moontracer
    restart: unless-stopped
    secrets:
      - discord_bot_token
      - discord_guild_id
    environment:
      DB_PATH: /app/data/moontracer.db
      ADMIN_ROLE_NAME: ${ADMIN_ROLE_NAME}
    volumes:
      - /var/lib/moontracer/media-host/moontracer:/app/data
    networks:
      - web_proxy

networks:
  web_proxy:
    external: true

secrets:
  discord_bot_token:
    file: /var/lib/moontracer/media-host/moontracer/secrets/discord_bot_token.txt
  discord_guild_id:
    file: /var/lib/moontracer/media-host/moontracer/secrets/discord_guild_id.txt

