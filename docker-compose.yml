# The built-in media server has no rate limiting. Front this with a reverse
# proxy (Caddy/Traefik/nginx) for TLS termination and rate limiting in prod.

services:
  moontracer:
    build: .
    image: moontracer:latest
    container_name: moontracer
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      VERBOSE: ${VERBOSE}
      SAFE_MODE: ${SAFE_MODE}
      DEV_MODE: ${DEV_MODE}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DEBUG_ADMIN_ID: ${DEBUG_ADMIN_ID}
      ADMIN_ROLE_NAME: ${ADMIN_ROLE_NAME}
      MOD_ROLE_NAME: ${MOD_ROLE_NAME}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL}
      MEDIA_PORT: ${MEDIA_PORT}
    volumes:
      - ${MOONTRACER_DATA_DIR:-./data}:/app/data
    networks:
      - web_proxy

networks:
  web_proxy:
    name: ${MOONTRACER_PROXY_NETWORK:-moontracer_web_proxy}
    external: ${MOONTRACER_PROXY_EXTERNAL:-false}
